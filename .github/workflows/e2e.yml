name: E2E

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    name: Playwright acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/effect-monorepo-test
      # Used by `@org/jobs` (background runner) when started in this job.
      # Same DB Playwright is exercising, so the purge runs against the test
      # data and we get end-to-end signal that the cron deployable works.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/effect-monorepo-test

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -F @org/acceptance exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm -F @org/acceptance exec playwright install-deps chromium

      - name: Bring up Postgres and Mailpit, create the test databases
        run: |
          set -euo pipefail
          docker compose up -d --wait postgres mailpit
          docker compose exec -T postgres psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE "effect-monorepo-test"'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'effect-monorepo-test')\gexec
          SELECT 'CREATE DATABASE "effect-monorepo-identity"'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'effect-monorepo-identity')\gexec
          SQL

      - name: Write .env
        # The identity Worker reads .env through `alchemy dev --env-file`, and
        # Playwright loads it for global-setup and the server it spawns.
        run: |
          set -euo pipefail
          sed -e "s/^SESSION_COOKIE_SECRET=.*/SESSION_COOKIE_SECRET=$(openssl rand -hex 32)/" \
            -e "s/^BETTER_AUTH_SECRET=.*/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" \
            -e "s/^IDENTITY_SEED_TOKEN=.*/IDENTITY_SEED_TOKEN=$(openssl rand -hex 16)/" \
            .env.example > .env

      - name: Apply database migrations
        run: |
          set -euo pipefail
          pnpm --filter @org/database db:migrate:test
          pnpm db:migrate:identity

      - name: Start the identity Worker
        # `alchemy dev` serves the identity Worker on :3002 in workerd, with
        # Hyperdrive passed through to the compose Postgres. It touches neither
        # Cloudflare nor Neon, so it needs no credentials.
        run: |
          set -euo pipefail
          mkdir -p /tmp/cf-dev-logs
          nohup pnpm dev:cf > /tmp/cf-dev-logs/cf-dev.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3002/api/auth/.well-known/openid-configuration > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cf-dev-logs/cf-dev.log
          exit 1

      - name: Start background jobs runner
        # Spin up the `@org/jobs` cron runner against the test DB so Playwright
        # exercises the same set of deployables that production will run.
        # The runner does an eager purge on boot and then waits for the hourly
        # cron — within a 25-minute job window only the boot run actually
        # fires, but that's enough to surface "the deployable doesn't start"
        # regressions and to keep CI honest about the system shape.
        # Backgrounded with logs to a file so the runner stays alive for the
        # whole Playwright run; the GitHub runner cleans up the process at
        # job end, no explicit teardown needed.
        run: |
          set -euo pipefail
          mkdir -p /tmp/jobs-logs
          nohup pnpm -F @org/jobs start:dev > /tmp/jobs-logs/jobs.log 2>&1 &
          echo $! > /tmp/jobs-logs/jobs.pid
          # Give the runner a moment to connect to Postgres + run the boot
          # purge before Playwright starts. The eager run logs a known line we
          # can poll for instead of sleeping blindly.
          for i in $(seq 1 30); do
            if grep -q "purge-expired-sessions" /tmp/jobs-logs/jobs.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "--- jobs.log so far ---"
          cat /tmp/jobs-logs/jobs.log

      - name: Run acceptance tests
        run: pnpm test:acceptance
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/acceptance/playwright-report/
          retention-days: 14

      - name: Dump background jobs log on failure
        if: failure()
        run: cat /tmp/jobs-logs/jobs.log || true

      - name: Dump the identity Worker's log on failure
        if: failure()
        run: cat /tmp/cf-dev-logs/cf-dev.log || true

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs postgres mailpit || true
