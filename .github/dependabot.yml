version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      svelte:
        patterns:
          - "svelte"
          - "svelte-*"
          - "@sveltejs/*"
          - "bits-ui"
      alchemy:
        patterns:
          - "alchemy"
          - "@alchemy.run/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/test"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
      prettier:
        patterns:
          - "prettier"
          - "prettier-*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
