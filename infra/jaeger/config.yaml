service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: memory_store
    # The browser and each Worker keep their own clock, so spans from
    # different services in one trace can drift by a few ms; this shifts a
    # child span back inside its parent. 1s is below any real gap.
    max_clock_skew_adjust: 1s

  jaeger_storage:
    backends:
      memory_store:
        memory:
          max_traces: 100000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://localhost:*
            - http://127.0.0.1:*
          allowed_headers:
            - "*"

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory_store
