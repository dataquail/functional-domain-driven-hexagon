services:
  postgres:
    container_name: effect-monorepo-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: effect-monorepo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run once, when the data volume is first created.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - jaeger-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d effect-monorepo"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    container_name: effect-monorepo-mailpit
    # Local mail sink: the server sends over SMTP (:1025), the identity Worker
    # through the HTTP send API (:8025), and the web UI is at :8025.
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - jaeger-network
    restart: unless-stopped

  jaeger:
    container_name: effect-monorepo-jaeger
    # Jaeger v2 (OTel-Collector-based). Pinned for reproducibility; bump
    # after checking https://github.com/jaegertracing/jaeger/releases.
    image: jaegertracing/jaeger:2.17.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP — CORS allows browser SPA origins (see config.yaml)
    volumes:
      - ./infra/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    networks:
      - jaeger-network
    restart: unless-stopped

networks:
  jaeger-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
